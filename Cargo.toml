[package]
name = "fold"
version = "0.1.0"
edition = "2024"
default-run = "fold"

[dependencies]
bytecheck = "0.6"
fixedbitset = "0.5.7"
itertools = "0.12"
rkyv = { version = "0.7", features = ["validation"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
rustc-hash = "1.1"
ratatui = "0.29"
crossterm = "0.28"
ctrlc = "3.4"
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2

[[bench]]
name = "spatial_bench"
harness = false
path = "benches/spatial_bench.rs"

[[bench]]
name = "ortho_bench"
harness = false
path = "benches/ortho_bench.rs"

[[bench]]
name = "interner_bench"
harness = false
path = "benches/interner_bench.rs"

[[bench]]
name = "splitter_bench"
harness = false
path = "benches/splitter_bench.rs"

[[bench]]
name = "dfs_ab_bench"
harness = false
path = "benches/dfs_ab_bench.rs"
